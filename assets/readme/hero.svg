<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">回答成书 — 把 ChatGPT 的长回答，翻成一页一页的书</title>
  <desc id="desc">暖灰底标题：回答成书；右侧是一本打开的双页书，左页有标题与正文行，右页是正文行，右侧有一列圆形工具栏：目录、排版、追问、深色、沉浸。</desc>

  <rect width="1200" height="360" rx="26" fill="#eceae4"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6f6152">CHROME 扩展 · MANIFEST V3 · READ CHATGPT LIKE A BOOK</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#2b2620">回答成书</text>
    <text x="56" y="168" font-size="23" fill="#2b2620">把 ChatGPT 的长回答，翻成一页一页的书</text>
    <text x="56" y="204" font-size="19" fill="#6d6257">分页阅读、三级目录、书内追问，位置始终记得。</text>
    <g id="chips" font-size="18" fill="#2b2620" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d8d0bf" stroke-width="1.5"/><text x="119" y="262">单双页</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d8d0bf" stroke-width="1.5"/><text x="257" y="262">三级目录</text></g>
      <g><rect x="332" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d8d0bf" stroke-width="1.5"/><text x="395" y="262">书内追问</text></g>
      <g><rect x="470" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d8d0bf" stroke-width="1.5"/><text x="533" y="262">v0.4.1</text></g>
    </g>
  </g>

  <g id="book" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="800" y="52" width="288" height="256" rx="12" fill="#ffffff" stroke="#d8d0bf" stroke-width="1.5"/>
    <line x1="944" y1="64" x2="944" y2="296" stroke="#eceae4" stroke-width="1.5"/>
    <text x="824" y="92" font-size="18" font-weight="700" fill="#2b2620">让阅读回到</text>
    <text x="824" y="114" font-size="18" font-weight="700" fill="#2b2620">一页之间</text>
    <g fill="#c9c2b4">
      <rect x="824" y="132" width="104" height="7" rx="3.5"/>
      <rect x="824" y="148" width="104" height="7" rx="3.5"/>
      <rect x="824" y="164" width="88" height="7" rx="3.5"/>
      <rect x="824" y="188" width="104" height="7" rx="3.5"/>
      <rect x="824" y="204" width="96" height="7" rx="3.5"/>
      <rect x="824" y="220" width="104" height="7" rx="3.5"/>
      <rect x="824" y="244" width="72" height="7" rx="3.5"/>
    </g>
    <g fill="#c9c2b4">
      <rect x="960" y="72" width="104" height="7" rx="3.5"/>
      <rect x="960" y="88" width="104" height="7" rx="3.5"/>
      <rect x="960" y="104" width="88" height="7" rx="3.5"/>
      <rect x="960" y="128" width="104" height="7" rx="3.5"/>
      <rect x="960" y="144" width="96" height="7" rx="3.5"/>
      <rect x="960" y="160" width="104" height="7" rx="3.5"/>
      <rect x="960" y="184" width="72" height="7" rx="3.5"/>
    </g>
    <text x="824" y="282" font-size="15" fill="#6f6152">‹ 上一页</text>
    <text x="944" y="282" font-size="15" fill="#6f6152" text-anchor="middle">1–2 / 4</text>
    <text x="1064" y="282" font-size="15" fill="#6f6152" text-anchor="end">下一页 ›</text>
    <g id="toolbar" fill="#ffffff" stroke="#d8d0bf" stroke-width="1.5">
      <circle cx="1120" cy="84" r="17"/>
      <circle cx="1120" cy="128" r="17"/>
      <circle cx="1120" cy="172" r="17"/>
      <circle cx="1120" cy="216" r="17"/>
      <circle cx="1120" cy="260" r="17"/>
    </g>
    <g stroke="#5d564a" stroke-width="2" stroke-linecap="round">
      <line x1="1112" y1="79" x2="1128" y2="79"/><line x1="1112" y1="84" x2="1128" y2="84"/><line x1="1112" y1="89" x2="1128" y2="89"/>
    </g>
    <text x="1120" y="135" font-size="17" font-weight="700" fill="#5d564a" text-anchor="middle">A</text>
    <g fill="none" stroke="#5d564a" stroke-width="2">
      <rect x="1112" y="164" width="16" height="11" rx="5"/>
      <path d="M 1116 175 L 1115 180 L 1121 175" fill="#ffffff" stroke-linejoin="round"/>
    </g>
    <circle cx="1120" cy="216" r="8" fill="#5d564a"/>
    <circle cx="1123.5" cy="213" r="6.5" fill="#ffffff"/>
    <g fill="none" stroke="#5d564a" stroke-width="2" stroke-linecap="round">
      <path d="M 1113 257 L 1113 253 L 1117 253 M 1127 257 L 1127 253 L 1123 253 M 1113 263 L 1113 267 L 1117 267 M 1127 263 L 1127 267 L 1123 267"/>
    </g>
  </g>
</svg>
