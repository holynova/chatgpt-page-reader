<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回答成书 · 分页测试</title>
<style>
*{box-sizing:border-box}[data-native-italic]{font-style:italic}[data-d-default-strong]{font-weight:600}body{margin:0;color:#292d29;background:#fff;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}aside{position:fixed;inset:0 auto 0 0;width:230px;padding:28px 22px;background:#f7f7f5;border-right:1px solid #eceee8}aside b{font-size:18px}aside p{color:#777d73;font-size:13px}aside .nav{padding:11px 12px;border-radius:7px;background:#e9ede5;margin-top:24px;font-size:13px}aside .note{position:absolute;bottom:28px;left:22px;right:22px;font-size:11px;color:#85897f}main{margin-left:230px;padding:26px 32px 140px;min-height:100vh}header.site{display:flex;justify-content:space-between;align-items:center;color:#72786c;margin-bottom:24px;font-size:12px}header.site strong{color:#343b32;font-size:18px;font-weight:500}article{max-width:740px;margin:0 auto}.prompt{margin:20px 0 34px auto;max-width:540px;padding:14px 20px;background:#f1f2ef;border-radius:18px;font-size:14px}.answer-label{font-size:11px;letter-spacing:.1em;color:#848b7c;margin-bottom:12px}.markdown h1{font-size:26px}.markdown p{line-height:1.9}.markdown table{border-collapse:collapse;width:100%}.markdown th,.markdown td{border:1px solid #ddd;padding:8px}.markdown pre{overflow:auto;background:#f4f4f1;padding:12px}.composer{position:fixed;bottom:18px;left:calc(230px + (100vw - 230px)/2);transform:translateX(-50%);width:min(700px,calc(100vw - 310px));border:1px solid #e0e4da;border-radius:22px;padding:16px 22px;color:#8a9085;background:#fff;box-shadow:0 8px 40px #fff;z-index:2}.composer fieldset{border:0;padding:0;margin:0;display:flex;align-items:center;width:100%;gap:10px}.composer textarea,.composer [contenteditable=true]{border:0;font:inherit;outline:none;flex:1;min-width:0;width:100%;height:28px;resize:none;background:transparent}.composer button{border:0;border-radius:20px;width:30px;height:30px;color:#fff;background:#42614b}.sample-tag{border:1px solid #dbe3d5;border-radius:20px;padding:4px 10px;color:#6b7e60}@media(max-width:800px){aside{width:160px}main{margin-left:160px;padding:16px}.composer{left:calc(160px + (100vw - 160px)/2);width:calc(100vw - 195px)}}
</style></head><body>
<aside><b>ChatGPT</b><p>新聊天　⌘ K</p><nav data-app-action-sidebar-scroll style="max-height:480px;overflow-y:auto"><a class="nav" data-interactive-row-link href="/c/reading" style="display:block;color:inherit;text-decoration:none">阅读，让注意力安静下来</a><a data-interactive-row-link href="/c/garden" style="display:block;color:#737c6c;text-decoration:none;padding:12px">一座花园的四季</a><a data-interactive-row-link href="/c/architecture" style="display:block;color:#737c6c;text-decoration:none;padding:12px">建筑中的留白</a><div data-sidebar-project-container-id="project:demo"><button type="button" role="button" data-app-action-sidebar-project-row data-app-action-sidebar-project-id="demo" data-app-action-sidebar-project-label="旅行手记" data-app-action-sidebar-project-collapsed="true" aria-expanded="false">旅行手记</button><div id="project-items" hidden></div></div></nav><p>项目</p><p>你的聊天</p><div class="note">本页是本地合成测试样例，不是真实 ChatGPT 对话。</div></aside>
<main><header class="site"><strong>ChatGPT <small>⌄</small></strong><span class="sample-tag">本地功能演示</span></header>
<article><div class="prompt" data-message-author-role="user">请写一篇关于阅读与注意力的长文，包含图片、表格和代码示例。</div><div class="answer-label">CHATGPT · 示例回答</div><div data-message-author-role="assistant" id="first"><div class="markdown" id="source"></div></div><div id="native-actions" style="color:#969c91;font-size:12px;padding-top:16px">复制　赞　重新生成 · 原有操作区保留</div></article>
<article style="margin-top:38px"><div class="prompt" data-message-author-role="user">另一条回答应当独立保留。</div><div data-message-author-role="assistant" id="second"><div class="markdown"><p>这是第二条独立回答。打开第一条回答的阅读器，不会隐藏或合并这里的内容。</p></div></div></article>
</main><form class="composer"><fieldset><textarea name="prompt" aria-label="询问任何问题" placeholder="询问任何问题（测试输入框）"></textarea><button type="submit" aria-label="发送">↑</button></fieldset></form>
<script>
const source=document.querySelector('#source');
const para='阅读是一种缓慢而主动的注意。我们在字里行间停留，给一个想法留下生长的空间。当视线不再追着滚动的页面移动，眼前的段落就有了稳定的位置。翻过一页，不必赶路，只需要让理解再向前一步。纸页的边界提醒我们：可以在这里停一下，也可以回头重读刚刚那句话。';
source.innerHTML='<h1>让阅读，回到一页之间</h1><p>从连续滚动到安静翻页，一次关于阅读节奏的小实验。</p><h2>一、把注意力交还给文字</h2><p>稳定的文字，让眼睛有处可停。<strong>分页保留原文与结构</strong>，也保留<a href="https://example.com/reading">链接</a>、列表和必要的图示。</p>';
for(let i=0;i<14;i++){const p=document.createElement('p');p.textContent=`【段落${i+1}】${para.repeat(i===4?8:2)} 🌿📖`;source.append(p);}
source.insertAdjacentHTML('beforeend','<h2>二、不同阅读方式的比较</h2><table><thead><tr><th>编号</th><th>观察维度</th><th>阅读体验</th><th>说明</th></tr></thead><tbody>'+Array.from({length:36},(_,i)=>`<tr><td>ROW-${i+1}</td><td>维度 ${i+1}</td><td>稳定的位置与清晰的节奏</td><td>保持正文内容，不混入其他回答。</td></tr>`).join('')+'</tbody></table><h2>三、给页面一个边界</h2><div class="code-wrapper"><div><button>复制代码</button></div><pre><code></code></pre></div>');
source.querySelector('code').textContent=Array.from({length:100},(_,i)=>`// CODE-${String(i+1).padStart(3,'0')} 保留代码原文与缩进\nconst page${i+1} = "${i===20?'very_long_line_'.repeat(45):'阅读的节奏'}";`).join('\n');
const img=document.createElement('img');img.alt='用于测试完整缩放与放大预览的插图';img.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="#e2e8db"/><circle cx="900" cy="230" r="110" fill="#d4b577"/><path d="M0 610L320 200L650 640L880 370L1200 640V800H0Z" fill="#6c8270"/><path d="M0 710L420 450L820 720L1200 500V800H0Z" fill="#425f4e"/></svg>');source.append(img);
source.insertAdjacentHTML('beforeend','<h2>四、为自己选择合适的阅读节奏</h2><h5>阅读建议</h5><h6>按自己的节奏</h6><ol start="3">'+Array.from({length:18},(_,i)=>`<li><strong>步骤 ${i+1}</strong>：${para}</li>`).join('')+'</ol><blockquote><p>好的阅读体验，应当让工具退后，让文字留在眼前。</p></blockquote><p>【全文结束】</p>');
source.insertAdjacentHTML('afterbegin','<p>保留 <em>斜体示例</em>、<del>删除线示例</del>、<code>行内代码</code>、<mark>标记示例</mark>。</p>');
source.querySelector('h2').insertAdjacentHTML('afterend','<h3>用小节组织阅读</h3><h4>保留标题层级</h4>');
if(new URLSearchParams(location.search).has('modern')){
  document.querySelectorAll('[data-message-author-role=user]').forEach((n,i)=>n.setAttribute('data-chatgpt-search-unit-key',`fixture:${i}:user`));
  source.querySelectorAll('em').forEach(n=>{const span=document.createElement('span');span.setAttribute('data-native-italic','');span.append(...n.childNodes);n.replaceWith(span);});
  source.querySelectorAll('strong').forEach(n=>{const span=document.createElement('span');span.setAttribute('data-d-default-strong','');span.append(...n.childNodes);n.replaceWith(span);});
  document.querySelectorAll('[data-message-author-role]').forEach(n=>n.removeAttribute('data-message-author-role'));
  document.querySelectorAll('.markdown').forEach(n=>{n.className='MarkdownRoot-fixture';n.setAttribute('data-markdown-text-style','assistant-message');});
  const textarea=document.querySelector('.composer textarea');const edit=document.createElement('div');edit.contentEditable='true';edit.setAttribute('role','textbox');edit.setAttribute('data-composer-markdown','');edit.setAttribute('aria-label','询问任何问题');textarea.replaceWith(edit);
}
const projectRow=document.querySelector('[data-app-action-sidebar-project-row]');
if(projectRow)projectRow.addEventListener('click',()=>{
  const items=document.querySelector('#project-items');const open=items.hidden;items.hidden=!open;projectRow.setAttribute('data-app-action-sidebar-project-collapsed',String(!open));projectRow.setAttribute('aria-expanded',String(open));
  if(!items.children.length){items.innerHTML='<a data-interactive-row-link href="/g/g-p-demo/c/project-one">项目中的一次对话</a><button type="button">展开显示</button>';items.querySelector('button').onclick=event=>{event.target.remove();const a=document.createElement('a');a.setAttribute('data-interactive-row-link','');a.href='/g/g-p-demo/c/project-two';a.textContent='项目中的下一次对话';items.append(a);};}
});
globalThis.__enableHistoryBatch=false;
document.querySelector('[data-app-action-sidebar-scroll]').addEventListener('scroll',event=>{
 if(!__enableHistoryBatch)return;__enableHistoryBatch=false;const a=document.createElement('a');a.setAttribute('data-interactive-row-link','');a.href='/c/older-history';a.textContent='更早的一段历史';event.currentTarget.append(a);
});
globalThis.__sentPrompts=[];
const nativeForm=document.querySelector('.composer');
nativeForm.addEventListener('submit',event=>{
  event.preventDefault();const editor=nativeForm.querySelector('textarea,[contenteditable=true]');const text=editor.tagName==='TEXTAREA'?editor.value:editor.innerText;
  if(!text.trim())return;__sentPrompts.push(text);
  if(editor.tagName==='TEXTAREA')editor.value='';else editor.replaceChildren();
  const answer=document.createElement('div');answer.id='reply-'+__sentPrompts.length;
  if(new URLSearchParams(location.search).has('modern'))answer.setAttribute('data-markdown-text-style','assistant-message');else {answer.dataset.messageAuthorRole='assistant';answer.innerHTML='<div class="markdown"></div>';}
  const body=answer.matches('[data-markdown-text-style]')?answer:answer.firstElementChild;
  const question=document.createElement('div');question.setAttribute('data-message-author-role','user');question.textContent=text;document.querySelector('main').append(question);
  body.innerHTML='<h2>追问的新回答</h2><p>这是独立的新回答，不会混入上一条回答。</p>';document.querySelector('main').append(answer);
  setTimeout(()=>{const p=document.createElement('p');p.textContent='【流式回答完成】后续内容继续出现在同一本阅读界面中。';body.append(p);},650);
});
document.querySelectorAll('a[data-interactive-row-link]').forEach(anchor=>anchor.addEventListener('click',event=>{
  event.preventDefault();history.pushState(null,'',anchor.href);document.querySelector('#first').remove();document.querySelector('#second').remove();
  const answer=document.createElement('div');answer.setAttribute('data-markdown-text-style','assistant-message');answer.innerHTML='<h1>'+anchor.textContent+'</h1><p>【切换会话成功】这是另一个会话的独立回答。</p>';document.querySelector('main').append(answer);
}));
if(new URLSearchParams(location.search).has('restore-round')){
 const missing=new URLSearchParams(location.search).has('missing-round');
 sessionStorage.setItem('__answer_book_navigation_v2',JSON.stringify({path:location.pathname,immersive:true,sourceId:'wanted-answer',offset:0,at:Date.now()}));
 let restored=false;document.scrollingElement.addEventListener('scroll',()=>{if(restored||missing)return;restored=true;const answer=document.createElement('div');answer.id='wanted-answer';answer.setAttribute('data-markdown-text-style','assistant-message');answer.innerHTML='<h2>所选的早期回答</h2><p>【目标轮次】不能误打开最后一条回答。</p>';document.querySelector('main').prepend(answer);});
}
// Simulates extension storage only on this local test page.
globalThis.chrome={runtime:{onMessage:{addListener(fn){globalThis.__readerRuntimeListener=fn;}}},storage:{local:{async get(key){return {[key]:JSON.parse(localStorage.getItem(key)||'null')};},async set(values){for(const [k,v] of Object.entries(values))localStorage.setItem(k,JSON.stringify(v));}}}};
</script><script src="../extension/styles.js"></script><script src="../extension/paginator.js"></script><script src="../extension/composer.js"></script><script src="../extension/catalog.js"></script><script src="../extension/content.js"></script><script src="browser-tests.js"></script><script src="edge-tests.js"></script><script src="progress-tests.js"></script><script src="immersive-tests.js"></script><script src="catalog-tests.js"></script>
</body></html>
